services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:  ${DATABASE_URL}       
      LOG_LEVEL: ${LOG_LEVEL}  
      AUTO_RUN: ${AUTO_RUN}    
      FEED_PATH: ${FEED_PATH}  
      PORTAL_PATH: ${PORTAL_PATH} 
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: >
      bash -c "
        python -m app.cli initdb &&
        if [ \"$AUTO_RUN\" = 'true' ]; then
          python -m app.cli import \"$FEED_PATH\" &&
          python -m app.cli sync \"$PORTAL_PATH\";
        fi &&
        tail -f /dev/null
      "
    restart: on-failure

  api:
      build: .
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        DATABASE_URL: postgresql+psycopg2://catalog:catalog@postgres:5432/catalog
        LOG_LEVEL: INFO
      volumes:
        - ./logs:/app/logs
        - ./data:/app/data
      ports:
        - "8000:8000"
      command: uvicorn app.api.api:app --host 0.0.0.0 --port 8000 --reload
      restart: unless-stopped

volumes:
  pgdata: