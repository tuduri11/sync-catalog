services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://catalog:catalog@postgres:5432/catalog        
      FEED_PATH: data/feed_items.csv
      PORTAL_PATH: data/portal_items.csv
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: on-failure